<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b14">
    <title>Hors connexion — Biblio</title>
    <link rel="icon" href="/pwa-icons/icon-192.png">
    <style>
        /* Page autonome : affichée par le service worker sans réseau, donc sans Tailwind ni polices externes. */
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #e8eaf0;
            background:
                radial-gradient(ellipse 70% 50% at 15% -10%, rgba(40, 60, 105, 0.55), transparent 60%),
                linear-gradient(180deg, #0b1222 0%, #070b14 45%, #05070d 100%);
        }
        main { width: 100%; max-width: 420px; text-align: center; }
        img { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 24px; }
        h1 { font-size: 24px; margin: 0 0 10px; }
        p { color: #a3abbd; line-height: 1.55; margin: 0 0 28px; }
        button {
            font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
            padding: 13px 26px; border-radius: 999px; border: 0; background: #f7f5f2; color: #10131c;
        }
        button:hover { background: #fff; }
        section { margin-top: 36px; text-align: left; }
        section[hidden] { display: none; }
        h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #6b7386; margin: 0 0 10px; }
        ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        a { display: block; padding: 12px 14px; border-radius: 10px; background: #121829; border: 1px solid rgba(255,255,255,.07);
            color: #e8eaf0; text-decoration: none; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a:hover { border-color: rgba(240, 113, 85, .6); }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-icons/icon-192.png" alt="">
        <h1>Vous êtes hors connexion</h1>
        <p>Cette page n'a pas encore été enregistrée sur cet appareil. Vérifiez votre connexion, puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>

        <section id="livres" hidden>
            <h2>Livres lisibles hors connexion</h2>
            <ul></ul>
        </section>
        <section id="pages" hidden>
            <h2>Pages enregistrées</h2>
            <ul></ul>
        </section>
    </main>
    <script>
        // Rechargement automatique dès le retour du réseau
        window.addEventListener('online', () => location.reload());

        // Pages gardées par le service worker (sw.js), les plus récentes d'abord.
        // Un lecteur n'est listé que si le PDF du livre est gardé lui aussi.
        (async function () {
            if (!('caches' in window)) return;
            const pages = await caches.open('biblio-pages-v1');
            const livres = await caches.open('biblio-livres-v1');
            const lecteurs = [], autres = [];
            // Le titre est pris tel quel dans le HTML : « &#039; » devient « ' »
            const texteDe = (html) => new DOMParser().parseFromString(html, 'text/html').documentElement.textContent.trim();

            for (const requete of await pages.keys()) {
                const reponse = await pages.match(requete);
                const entree = {
                    url: requete.url,
                    titre: texteDe(decodeURIComponent(reponse.headers.get('X-Biblio-Titre') || '')) || new URL(requete.url).pathname,
                    date: Number(reponse.headers.get('X-Biblio-Date')) || 0,
                };
                if (!/\/livres\/[^/]+\/lire$/.test(new URL(requete.url).pathname)) { autres.push(entree); continue; }
                const pdf = ((await reponse.text()).match(/pdf:\s*("(?:[^"\\]|\\.)*")/) || [])[1];
                if (pdf && await livres.match(JSON.parse(pdf))) lecteurs.push(entree);
            }

            function lister(id, liste) {
                if (!liste.length) return;
                const section = document.getElementById(id);
                for (const entree of liste.sort((a, b) => b.date - a.date)) {
                    const lien = document.createElement('a');
                    lien.href = entree.url;
                    lien.textContent = entree.titre;
                    const li = document.createElement('li');
                    li.appendChild(lien);
                    section.querySelector('ul').appendChild(li);
                }
                section.hidden = false;
            }
            lister('livres', lecteurs);
            lister('pages', autres);
        })();
    </script>
</body>
</html>
