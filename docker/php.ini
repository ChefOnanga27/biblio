; Réglages PHP de l'image Docker

; Envois de fichiers : PDF jusqu'à 500 Mo côté admin (règle de LivreFormRequest)
upload_max_filesize = 520M
post_max_size = 525M
max_execution_time = 120
memory_limit = 512M

expose_php = Off
date.timezone = Africa/Libreville

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
