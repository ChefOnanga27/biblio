# Lancement de l'application avec Neon (base PostgreSQL + Object Storage) :
#   docker compose up -d --build
#   Site     : http://localhost:8000
#   Emails   : http://localhost:8025  (Mailpit, boîte mail de test)
#
# `neon env pull` écrit dans .env DATABASE_URL, DATABASE_URL_UNPOOLED et les variables AWS_* du bucket ;
# y ajouter DB_CONNECTION=neon et MEDIA_DISK=neon (voir .env.example).
#
# Pour tester avec une base MySQL locale à la place : docker compose --profile mysql up -d
# (et DB_CONNECTION=mysql, DB_HOST=db dans .env).

services:
  app:
    build: .
    image: biblio:latest
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      # Emails de test envoyés à Mailpit ; en production, configurez un vrai serveur SMTP dans .env
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:80"
    volumes:
      # Utile seulement si MEDIA_DISK=public (fichiers stockés dans le conteneur)
      - storage:/var/www/html/storage/app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  db:
    profiles: ["mysql"]
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  storage:
  mysql:
