# Déploiement sur Render (Blueprint) : Dashboard Render → New → Blueprint → choisir ce dépôt.
# Les valeurs marquées « sync: false » sont demandées à la création : elles ne sont jamais écrites ici.
# Base de données et fichiers : Neon, Postgres + Object Storage (le disque de Render est effacé à chaque déploiement).

services:
  - type: web
    name: biblio
    runtime: docker
    plan: free               # gratuit (mise en veille après 15 min d'inactivité) ; « starter » pour rester éveillé
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Biblio
      - key: SITE_NOM
        value: Biblio
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false            # php artisan key:generate --show
      - key: APP_URL
        sync: false            # ex. https://biblio.onrender.com
      - key: LOG_CHANNEL
        value: stderr          # journaux visibles dans l'onglet « Logs » de Render
      - key: RUN_MIGRATIONS
        value: "true"

      # Base PostgreSQL Neon : valeurs de `neon env pull` (ou Console Neon → Connect)
      - key: DB_CONNECTION
        value: neon
      - key: DATABASE_URL
        sync: false            # connexion pooled (hôte en -pooler), utilisée par l'application
      - key: DATABASE_URL_UNPOOLED
        sync: false            # connexion directe, utilisée pour les migrations au démarrage

      # Fichiers : Neon Object Storage, bucket « medias » (public_read) déclaré dans neon.ts
      - key: MEDIA_DISK
        value: neon
      - key: NEON_BUCKET
        value: medias
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Emails (codes de vérification) : un vrai serveur SMTP est indispensable en production
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Biblio
